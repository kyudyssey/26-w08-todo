<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="할 일을 기록하고 완료 상태와 진행률을 관리하는 To-Do 리스트">
    <title>To-Do 리스트</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    >
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="container py-4 py-md-5">
      <div class="row justify-content-center">
        <section class="col-12 col-lg-8 col-xl-7" aria-labelledby="page-title">
          <div class="card app-card">
            <div class="card-body p-4 p-md-5">
              <header class="mb-4">
                <p class="eyebrow mb-2">MY DAY</p>
                <h1 class="h2 mb-2" id="page-title">오늘의 할 일</h1>
                <p class="text-secondary mb-0">할 일을 정리하고 하나씩 완료해 보세요.</p>
              </header>

              <div id="app-message" class="alert d-none" role="status" aria-live="polite"></div>

              <form id="todo-form" class="mb-4">
                <label class="visually-hidden" for="todo-input">새 할 일</label>
                <div class="todo-entry">
                  <span class="add-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" focusable="false">
                      <path d="M12 5v14M5 12h14"></path>
                    </svg>
                  </span>
                  <input
                    class="form-control"
                    id="todo-input"
                    name="todo"
                    type="text"
                    placeholder="할 일을 입력하세요"
                    autocomplete="off"
                    aria-describedby="input-help"
                  >
                  <button class="btn add-button" type="submit">추가</button>
                </div>
                <div class="form-text" id="input-help">Enter 키를 눌러도 등록할 수 있습니다.</div>
              </form>

              <section class="mb-4" aria-labelledby="progress-heading">
                <div class="d-flex justify-content-between align-items-center mb-2">
                  <h2 class="h6 mb-0" id="progress-heading">진행률</h2>
                  <span class="small progress-count" id="progress-count">완료 0 / 전체 0</span>
                </div>
                <div
                  class="progress"
                  role="progressbar"
                  aria-label="할 일 진행률"
                  aria-valuemin="0"
                  aria-valuemax="100"
                  aria-valuenow="0"
                >
                  <div id="progress-bar" class="progress-bar" style="width: 0%">0%</div>
                </div>
              </section>

              <section aria-labelledby="list-heading">
                <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-3">
                  <h2 class="h5 mb-0" id="list-heading">할 일 목록</h2>
                  <div class="filter-tabs" role="group" aria-label="할 일 필터">
                    <button class="filter-button active" type="button" data-filter="all" aria-pressed="true">전체</button>
                    <button class="filter-button" type="button" data-filter="active" aria-pressed="false">진행 중</button>
                    <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">완료</button>
                  </div>
                </div>

                <p id="empty-state" class="text-center text-secondary py-4 mb-0" role="status" aria-live="polite">
                  아직 할 일이 없습니다. 새로운 할 일을 추가해 보세요.
                </p>
                <ul id="todo-list" class="list-group"></ul>
              </section>
            </div>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
